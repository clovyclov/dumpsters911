<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TinaCMS Admin Panel | Dumpsters 911</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background-color: #f8fafc;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
      }
      .card {
        background: #ffffff;
        border: 3.5px solid #000000;
        box-shadow: 8px 8px 0px #000000;
        border-radius: 12px;
        padding: 40px;
        max-width: 520px;
        text-align: center;
      }
      h1 {
        font-size: 1.8rem;
        margin-top: 0;
        color: #0f172a;
      }
      p {
        color: #475569;
        font-size: 1.05rem;
        line-height: 1.6;
        margin-bottom: 30px;
      }
      .btn {
        display: inline-block;
        background-color: #e11d48;
        color: #ffffff;
        font-weight: 800;
        text-decoration: none;
        padding: 14px 28px;
        border-radius: 8px;
        border: 2.5px solid #000;
        box-shadow: 4px 4px 0px #000;
        font-size: 1.1rem;
        transition: transform 0.1s ease;
      }
      .btn:hover {
        transform: translate(-2px, -2px);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <img src="/assets/images/d-911-red-logo.png" alt="Dumpsters 911" style="max-height: 50px; margin-bottom: 20px;">
      <h1>TinaCMS Visual Dashboard</h1>
      <p>Click below to launch the live drag-and-drop editor connected to your website and GitHub repository.</p>
      <a href="https://app.tina.io/projects/c5bb6ad6-5c8b-4da9-bd28-90df02a933c8" target="_blank" rel="noopener" class="btn">
        Launch Visual Editor →
      </a>
    </div>
  </body>
</html>
