<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TinaCMS Admin Portal | Dumpsters 911</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 20px;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background-color: #0f172a;
        color: #f8fafc;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
      }
      .card {
        background: #ffffff;
        color: #0f172a;
        border: 3.5px solid #000000;
        box-shadow: 10px 10px 0px var(--primary-red, #e11d48);
        border-radius: 16px;
        padding: 45px 35px;
        max-width: 520px;
        width: 100%;
        text-align: center;
      }
      .logo {
        max-height: 52px;
        margin-bottom: 25px;
      }
      h1 {
        font-size: 1.75rem;
        font-weight: 800;
        margin-top: 0;
        margin-bottom: 12px;
        color: #0f172a;
      }
      p {
        color: #475569;
        font-size: 1.05rem;
        line-height: 1.6;
        margin-bottom: 30px;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        background-color: #e11d48;
        color: #ffffff;
        font-weight: 800;
        text-decoration: none;
        padding: 16px 32px;
        border-radius: 10px;
        border: 3px solid #000000;
        box-shadow: 5px 5px 0px #000000;
        font-size: 1.1rem;
        width: 100%;
        transition: all 0.15s ease;
      }
      .btn:hover {
        transform: translate(-2px, -2px);
        box-shadow: 7px 7px 0px #000000;
        background-color: #be123c;
      }
      .note {
        margin-top: 25px;
        font-size: 0.88rem;
        color: #64748b;
        background: #f1f5f9;
        padding: 12px 16px;
        border-radius: 8px;
        border: 1px solid #cbd5e1;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <img src="/assets/images/d-911-red-logo.png" alt="Dumpsters 911" class="logo">
      <h1>TinaCMS Visual Dashboard</h1>
      <p>Click below to launch the live drag-and-drop editor connected directly to your GitHub repository.</p>
      
      <a href="https://app.tina.io/projects/c5bb6ad6-5c8b-4da9-bd28-90df02a933c8" target="_blank" rel="noopener" class="btn">
        🚀 Launch Visual Editor
      </a>

      <div class="note">
        <strong>Tip:</strong> Log in with your TinaCloud credentials to visually edit articles, pricing, and content live.
      </div>
    </div>
  </body>
</html>
