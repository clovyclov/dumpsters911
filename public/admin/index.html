<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/admin/assets/favicon-eb31bc17.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TinaCMS</title>
    <script type="module" crossorigin src="./assets/index-86e5e2db.js"></script>
    <link rel="stylesheet" href="./assets/index-53e50aaf.css">
  </head>
  <body class="tina-tailwind">
    <div id="root"></div>
    <script>
      function handleLoadError() {
        console.error('Failed to load assets')
        document.getElementById('root').innerHTML =
          '<div style="max-width:600px;margin:50px auto;padding:40px;text-align:center;background:#fff;border-radius:12px;box-shadow:0 10px 25px rgba(0,0,0,0.1);font-family:sans-serif;">' +
          '<h1 style="color:#e11d48;margin-bottom:12px;">TinaCMS Loading Timeout</h1>' +
          '<p style="color:#475569;font-size:1.05rem;">The visual editor assets are loading. If this persists, please refresh the page.</p>' +
          '</div>'
      }

      setTimeout(() => {
        if (!document.getElementById('root').children.length) {
          handleLoadError()
        }
      }, 15000)
    </script>
  </body>
</html>
