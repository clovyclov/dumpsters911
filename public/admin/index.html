<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dumpsters 911 Admin CMS</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <!-- Load TinaCMS Single Page Application from CDN -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script type="module">
      import TinaCMSApp from 'https://cdn.jsdelivr.net/npm/@tinacms/app@1.5.21/dist/index.js';
    </script>
  </head>
  <body style="margin: 0; padding: 0; background-color: #0f172a;">
    <div id="root"></div>
    <script type="module">
      import React from 'https://esm.sh/react@18';
      import ReactDOM from 'https://esm.sh/react-dom@18/client';
      import { TinaAdmin } from 'https://esm.sh/@tinacms/app@1.5.21';

      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(
        React.createElement(TinaAdmin, {
          clientId: 'c5bb6ad6-5c8b-4da9-bd28-90df02a933c8',
          branch: 'main',
          isLocal: false
        })
      );
    </script>
  </body>
</html>
